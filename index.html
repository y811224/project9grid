<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#073B7A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="9Grid" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <title>Project 9Grid</title>
  <style>
    :root{
      --navy:#073B7A;--blue:#0F5AA7;--sky:#2CA8F2;--bg:#F4F7FB;--card:#fff;
      --text:#172033;--muted:#6D7789;--line:#E4E9F1;--good:#1C9A68;--warn:#E59A1A;--bad:#D44C4C;
      --shadow:0 10px 28px rgba(15,47,90,.09);--r:18px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    .app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    .top{position:relative;z-index:20;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:18px 18px 16px;border-radius:0 0 26px 26px}
    .top small{opacity:.82;letter-spacing:.08em}.top h1{margin:4px 0 0;font-size:24px}.top p{margin:5px 0 0;font-size:13px;opacity:.88}
    .content{padding:16px;min-height:calc(100vh - 170px)}.screen{display:none}.screen.active{display:block;min-height:1px}
    .card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
    .title{font-size:18px;font-weight:900;margin:6px 0 12px}.sub{font-size:13px;color:var(--muted)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#F8FAFD;border:1px solid var(--line);border-radius:16px;padding:14px}
    .metric b{display:block;font-size:28px;color:var(--navy)}.metric span{font-size:13px;color:var(--muted)}
    .btn{border:0;border-radius:14px;padding:13px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;width:100%}.btn.secondary{background:#EAF4FF;color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);width:100%}.btn.danger{background:#FFF0F0;color:var(--bad);width:100%}
    .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
    .list{background:#fff;border-radius:var(--r);padding:0 16px;box-shadow:var(--shadow)}.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border-bottom:0}.name{font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#EAF3FF;color:var(--navy);white-space:nowrap}
    .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{min-height:110px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px;text-align:left;position:relative}.cell.center{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0}.cell b{display:block}.cell strong{font-size:27px;display:block;margin-top:10px}.cell small{position:absolute;bottom:9px;left:10px;color:var(--muted);font-size:11px}.cell.center small{color:#dcecff}
    label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--text)}textarea{min-height:88px}
    .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px}.nav button.active{color:var(--navy);font-weight:900}
    .modal{position:fixed;inset:0;background:rgba(13,25,45,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;overscroll-behavior:none}
    .modal.show{display:flex}
    .sheet{width:min(520px,100%);height:min(92dvh,92vh);overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:26px 26px 0 0;padding:0 18px calc(32px + env(safe-area-inset-bottom));overscroll-behavior:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-padding-top:82px}
    .sheet-head{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;min-height:68px;margin:0 -18px 12px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .sheet-head h3{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}
    .close{flex:0 0 38px;border:0;background:#EEF2F7;width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1}
    body.modal-open{overflow:hidden}
    .task{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.task.overdue{border-color:#F3C4C4;background:#FFF8F8}
    .progress{height:9px;background:#E8EDF4;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--sky)}
    .pillbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.pill{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;white-space:nowrap}.pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .empty{text-align:center;color:var(--muted);padding:26px 8px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.section-head h2{font-size:18px;margin:0}
    .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.quick-actions a,.quick-actions button{border:0;border-radius:13px;padding:11px 8px;text-decoration:none;text-align:center;font-weight:900;background:#EAF4FF;color:var(--navy)}.timeline{border-left:3px solid #DCE8F6;margin:12px 0 0 8px;padding-left:16px}.timeline-entry{position:relative;padding:0 0 16px}.timeline-entry:before{content:"";position:absolute;left:-23px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--sky);border:3px solid #fff}.timeline-entry b{display:block}.timeline-entry span{font-size:12px;color:var(--muted)}.birthday{border:1px solid #F1D7A7;background:#FFF9ED;border-radius:14px;padding:12px;margin-bottom:10px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tab-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap;font-weight:800}.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}.heat{font-size:18px;letter-spacing:1px;color:#E9A31A}.tag{display:inline-block;background:#EEF4FB;color:var(--navy);padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800;margin:3px 4px 3px 0}.policy-card,.todo-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.tree-node{border-left:2px solid #D9E5F3;padding:8px 0 8px 14px;margin-left:8px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-grid .cell{min-height:88px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#14213A;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1}
    .hidden{display:none!important}.lock{position:fixed;inset:0;width:100%;height:100dvh;background:linear-gradient(150deg,var(--navy),var(--blue));z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;-webkit-overflow-scrolling:touch}.lock-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:24px;text-align:center}.logo9{width:82px;height:82px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.logo9 i{display:block;background:#E9F4FF;border-radius:8px}.logo9 i:nth-child(5){background:var(--sky)}
  </style>
</head>
<body>
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="logo9"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h2>Project 9Grid</h2>
    <p class="sub">保險顧問智慧客戶經營系統</p>
    <div id="setupPin">
      <label style="text-align:left">設定 4 位數密碼</label>
      <input id="pin1" inputmode="numeric" maxlength="4" placeholder="例如 1234">
      <button class="btn primary" style="margin-top:14px" onclick="setPin()">建立並進入</button>
    </div>
    <div id="loginPin" class="hidden">
      <label style="text-align:left">輸入密碼</label>
      <input id="pin2" inputmode="numeric" maxlength="4" placeholder="4 位數密碼">
      <button class="btn primary" style="margin-top:14px" onclick="login()">登入</button>
    </div>
    <p class="sub" style="margin-top:14px">資料目前儲存在這支手機；請定期使用「匯出備份」。</p>
  </div>
</div>

<div class="app">
  <header class="top">
    <small>PROJECT 9GRID</small>
    <h1 id="headTitle">首頁戰情室</h1>
    <p id="headSub">成交客戶 → 轉介紹 → 新成交</p>
  </header>

  <main class="content">
    <section id="home" class="screen active">
      <div class="section-head"><h2>今日重點</h2><span class="badge" id="todayLabel"></span></div>
      <div class="card" id="todayTasks"></div><div class="title">近期生日</div><div class="card" id="birthdayList"></div>
      <div class="title">整體概況</div>
      <div class="grid2">
        <div class="metric"><b id="mCustomers">0</b><span>成交客戶</span></div>
        <div class="metric"><b id="mPeople">0</b><span>總人脈</span></div>
        <div class="metric"><b id="mFollow">0</b><span>待追蹤</span></div>
        <div class="metric"><b id="mDeals">0</b><span>人脈成交</span></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="row"><div><b>九宮格平均完成度</b><div class="sub">八類至少各有一位人脈</div></div><div style="text-align:right;font-size:24px;font-weight:900" id="completionText">0%</div></div>
        <div class="progress" style="margin-top:12px"><div id="completionBar"></div></div>
      </div>
      <button class="btn primary" onclick="openCustomer()">＋ 新增成交客戶</button>
    </section>

    <section id="customers" class="screen">
      <div class="row" style="margin-bottom:12px"><input id="customerSearch" placeholder="搜尋姓名、職業或公司" oninput="renderCustomers()"><button class="btn secondary" style="max-width:100px" onclick="openCustomer()">＋ 新增</button></div>
      <div id="customerList" class="list"></div>
    </section>

    <section id="grid" class="screen">
      <div id="gridEmpty" class="card empty">請先新增成交客戶。</div>
      <div id="gridWrap" class="hidden">
        <div class="card">
          <label style="margin-top:0">目前中心客戶</label>
          <select id="gridCustomerSelect" onchange="switchCustomer(this.value)"></select>
        </div>
        <div id="grid9" class="grid9"></div>
        <button class="btn primary" style="margin-top:14px" onclick="openPerson()">＋ 新增九宮格人脈</button>
      </div>
    </section>

    <section id="tasks" class="screen">
      <div class="pillbar">
        <button class="pill active" onclick="setTaskFilter('all',this)">全部</button>
        <button class="pill" onclick="setTaskFilter('overdue',this)">逾期</button>
        <button class="pill" onclick="setTaskFilter('today',this)">今天</button>
        <button class="pill" onclick="setTaskFilter('week',this)">7天內</button>
      </div>
      <div class="card" id="taskList" style="margin-top:12px"></div>
    </section>

    <section id="stats" class="screen">
      <div class="card"><div class="title" style="margin-top:0">開發漏斗</div><div id="funnel"></div></div>
      <div class="card"><div class="title" style="margin-top:0">人脈來源</div><div id="sourceStats"></div></div><div class="card"><div class="title" style="margin-top:0">成交樹</div><div id="referralTree"></div></div>
      <div class="card">
        <div class="title" style="margin-top:0">資料管理</div>
        <button class="btn ghost" onclick="exportData()">匯出備份檔</button>
        <label>匯入備份檔</label><input id="importFile" type="file" accept=".json" onchange="importData(event)">
        <button class="btn danger" style="margin-top:12px" onclick="resetAll()">清除所有資料</button>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="active" data-screen="home">首頁</button>
    <button data-screen="customers">客戶</button>
    <button data-screen="grid">九宮格</button>
    <button data-screen="tasks">待辦</button>
    <button data-screen="stats">統計</button>
  </nav>
</div>

<div id="customerModal" class="modal"><div class="sheet">
  <div class="sheet-head"><h3 id="customerModalTitle">新增成交客戶</h3><button class="close" onclick="closeM('customerModal')" aria-label="關閉">×</button></div>
  <input id="cId" type="hidden">
  <label>姓名 *</label><input id="cName">
  <label>手機</label><input id="cPhone" inputmode="tel">
  <label>LINE</label><input id="cLine">
  <div class="row"><div><label>生日</label><input id="cBirthday" type="date"></div><div><label>成交日期 *</label><input id="cDate" type="date"></div></div>
  <label>職業</label><input id="cJob">
  <label>公司</label><input id="cCompany">
  <label>家庭狀況</label><select id="cFamily"><option>未填寫</option><option>未婚</option><option>已婚</option><option>已婚有子女</option></select>
  <label>年繳保費</label><input id="cPremium" inputmode="numeric" placeholder="例如 60000">
  <label>成交類型</label><select id="cType"><option>壽險</option><option>醫療</option><option>重大傷病</option><option>長照</option><option>投資型</option><option>其他</option></select>
  <label>介紹來源</label><input id="cSource">
  <label>備註</label><textarea id="cNote"></textarea>
  <button class="btn primary" style="margin-top:15px" onclick="saveCustomer()">儲存客戶</button>
</div></div>

<div id="personModal" class="modal"><div class="sheet">
  <div class="sheet-head"><h3 id="personModalTitle">新增人脈</h3><button class="close" onclick="closeM('personModal')" aria-label="關閉">×</button></div>
  <input id="pId" type="hidden">
  <label>所屬成交客戶</label><select id="pCustomer"></select>
  <label>姓名 *</label><input id="pName">
  <label>分類</label><select id="pCategory"></select>
  <label>關係說明</label><input id="pRelation" placeholder="例如：大學同學、前主管">
  <label>手機</label><input id="pPhone" inputmode="tel">
  <label>LINE</label><input id="pLine">
  <label>職業</label><input id="pJob">
  <label>公司</label><input id="pCompany">
  <label>人生事件</label><select id="pEvent"><option>無</option><option>結婚</option><option>買房</option><option>生小孩</option><option>換工作</option><option>創業</option><option>準備退休</option></select>
  <label>關係熱度</label><select id="pHeat"><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select><label>標籤</label><input id="pTags" placeholder="例如：高資產, 有小孩"><label>最後聯絡日期</label><input id="pLastContact" type="date"><label>目前進度</label><select id="pStatus"></select>
  <label>下次追蹤日期</label><input id="pFollow" type="date">
  <label>備註</label><textarea id="pNote"></textarea>
  <button class="btn primary" style="margin-top:15px" onclick="savePerson()">儲存人脈</button>
</div></div>

<div id="detailModal" class="modal"><div class="sheet">
  <div class="sheet-head"><h3>詳細資料</h3><button class="close" onclick="closeM('detailModal')" aria-label="關閉">×</button></div><div id="detail"></div>
</div></div>


<div id="contactModal" class="modal"><div class="sheet">
  <div class="sheet-head"><h3>新增聯絡紀錄</h3><button class="close" onclick="closeM('contactModal')" aria-label="關閉">×</button></div>
  <input id="logPersonId" type="hidden">
  <label>日期</label><input id="logDate" type="date">
  <label>聯絡方式</label><select id="logMethod"><option>LINE</option><option>電話</option><option>面談</option><option>視訊</option><option>Email</option><option>其他</option></select>
  <label>內容</label><textarea id="logNote" placeholder="紀錄這次互動重點"></textarea>
  <label>下一步</label><input id="logNext" placeholder="例如：下週約訪、補資料">
  <button class="btn primary" style="margin-top:15px" onclick="saveContactLog()">儲存紀錄</button>
</div></div>

<div id="policyModal" class="modal"><div class="sheet"><div class="sheet-head"><h3>新增保單</h3><button class="close" onclick="closeM('policyModal')">×</button></div><input id="policyCustomerId" type="hidden"><label>保險公司</label><input id="policyCompany"><label>商品名稱</label><input id="policyName"><label>類型</label><select id="policyType"><option>壽險</option><option>醫療</option><option>重大傷病</option><option>癌症</option><option>長照</option><option>意外</option><option>投資型</option><option>其他</option></select><label>保額</label><input id="policyCoverage" inputmode="numeric"><label>年繳保費</label><input id="policyPremium" inputmode="numeric"><label>生效日</label><input id="policyStart" type="date"><label>備註</label><textarea id="policyNote"></textarea><button class="btn primary" style="margin-top:15px" onclick="savePolicy()">儲存保單</button></div></div>
<div id="todoModal" class="modal"><div class="sheet"><div class="sheet-head"><h3>新增待辦</h3><button class="close" onclick="closeM('todoModal')">×</button></div><input id="todoCustomerId" type="hidden"><label>待辦內容</label><input id="todoTitle"><label>日期</label><input id="todoDate" type="date"><label>備註</label><textarea id="todoNote"></textarea><button class="btn primary" style="margin-top:15px" onclick="saveTodo()">儲存待辦</button></div></div>
<div id="toast" class="toast"></div>

<script>
const categories=['親戚','同學','鄰居','同事','前同事','家人','朋友','社團'];
const statuses=['尚未提及','客戶願意介紹','已取得聯絡方式','已加入LINE','已完成聊天','已約訪','完成需求分析','已提案','已成交','暫緩','拒絕','無法聯絡'];
let taskFilter='all';
let state=JSON.parse(localStorage.getItem('p9data')||'null')||{customers:[],people:[],logs:[],policies:[],todos:[],selectedCustomerId:''};if(!state.logs)state.logs=[];if(!state.policies)state.policies=[];if(!state.todos)state.todos=[];state.people=state.people.map(p=>({...p,heat:p.heat||3,lastContact:p.lastContact||'',tags:p.tags||''}));

const $=id=>document.getElementById(id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isoToday=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.replaceAll('-','/'):'未設定';
const money=n=>Number(n||0).toLocaleString('zh-TW');

function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function resetPageTop(){
  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;
  window.scrollTo(0,0);
  requestAnimationFrame(()=>{
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
    window.scrollTo(0,0);
    setTimeout(()=>window.scrollTo(0,0),80);
  });
}
function persist(){localStorage.setItem('p9data',JSON.stringify(state));renderAll()}
let pageScrollY=0;
function openM(id){
  pageScrollY=window.scrollY || document.documentElement.scrollTop || 0;
  $(id).classList.add('show');
  document.body.classList.add('modal-open');
  const sheet=$(id).querySelector('.sheet');
  if(sheet)sheet.scrollTop=0;
}
function closeM(id){
  $(id).classList.remove('show');
  if(!document.querySelector('.modal.show')){
    document.body.classList.remove('modal-open');
    setTimeout(()=>window.scrollTo(0,pageScrollY),0);
  }
}
window.addEventListener('click',e=>{if(e.target.classList.contains('modal'))closeM(e.target.id)});

function setupLock(){
  const pin=localStorage.getItem('p9pin');
  $('setupPin').classList.toggle('hidden',!!pin);$('loginPin').classList.toggle('hidden',!pin);
}
function setPin(){const v=$('pin1').value.trim();if(!/^\d{4}$/.test(v))return toast('請輸入 4 位數字');localStorage.setItem('p9pin',v);$('lock').classList.add('hidden');resetPageTop();}
function login(){if($('pin2').value===localStorage.getItem('p9pin')){$('lock').classList.add('hidden');resetPageTop()}else toast('密碼錯誤')}
setupLock();

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navTo(b.dataset.screen));
function navTo(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));
  const t={home:['首頁戰情室','成交客戶 → 轉介紹 → 新成交'],customers:['成交客戶','管理客戶與九宮格中心'],grid:['人脈九宮格','八大關係來源'],tasks:['待辦追蹤','今天該聯絡誰'],stats:['統計與備份','掌握開發進度']};
  $('headTitle').textContent=t[id][0];$('headSub').textContent=t[id][1];

}

function renderAll(){renderHome();renderCustomers();renderGrid();renderTasks();renderStats();fillSelects()}
function renderHome(){
  const today=isoToday();$('todayLabel').textContent=fmt(today);
  $('mCustomers').textContent=state.customers.length;$('mPeople').textContent=state.people.length;
  $('mFollow').textContent=state.people.filter(p=>p.follow&&p.status!=='已成交').length;
  $('mDeals').textContent=state.people.filter(p=>p.status==='已成交').length;
  let pct=0;if(state.customers.length){pct=Math.round(state.customers.reduce((s,c)=>s+new Set(state.people.filter(p=>p.customerId===c.id).map(p=>p.category)).size/8*100,0)/state.customers.length)}
  $('completionText').textContent=pct+'%';$('completionBar').style.width=pct+'%';
  const tasks=state.people.filter(p=>p.follow&&p.status!=='已成交').sort((a,b)=>a.follow.localeCompare(b.follow)).slice(0,4);
  $('todayTasks').innerHTML=tasks.length?tasks.map(p=>`<div class="task ${p.follow<today?'overdue':''}" onclick="openPersonDetail('${p.id}')"><b>${p.name}</b>｜${p.status}<div class="meta">${fmt(p.follow)}・${p.category}</div></div>`).join(''):'<div class="empty">目前沒有待追蹤事項</div>';
  const now=new Date(),y=now.getFullYear(); const birthdays=state.customers.filter(c=>c.birthday).map(c=>{const md=c.birthday.slice(5);let next=new Date(`${y}-${md}T00:00:00`);if(next<new Date(today+'T00:00:00'))next=new Date(`${y+1}-${md}T00:00:00`);return {...c,days:Math.ceil((next-new Date(today+'T00:00:00'))/86400000)}}).filter(c=>c.days<=30).sort((a,b)=>a.days-b.days);
  $('birthdayList').innerHTML=birthdays.length?birthdays.map(c=>`<div class="birthday" onclick="openCustomerDetail('${c.id}')"><b>${c.name}</b><div class="meta">${c.days===0?'今天生日':`${c.days} 天後生日`}・${c.birthday.slice(5).replace('-','/')}</div></div>`).join(''):'<div class="empty">30 天內沒有客戶生日</div>';
}
function renderCustomers(){
  const q=($('customerSearch').value||'').toLowerCase();

  $('customerList').innerHTML=arr.length?arr.map(c=>{const ps=state.people.filter(p=>p.customerId===c.id);return `<div class="item" onclick="openCustomerDetail('${c.id}')"><div><div class="name">${c.name}</div><div class="meta">${c.job||'未填職業'}${c.company?'・'+c.company:''}</div><div class="meta">九宮格 ${ps.length} 人・年繳保費 NT$${money(c.premium)}</div></div><span class="badge">${c.type}</span></div>`}).join(''):'<div class="empty">尚無成交客戶</div>';
}
function renderGrid(){
  if(!state.customers.length){$('gridEmpty').classList.remove('hidden');$('gridWrap').classList.add('hidden');return}
  $('gridEmpty').classList.add('hidden');$('gridWrap').classList.remove('hidden');
  if(!state.customers.some(c=>c.id===state.selectedCustomerId))state.selectedCustomerId=state.customers[0].id;
  const c=state.customers.find(c=>c.id===state.selectedCustomerId);
  $('gridCustomerSelect').innerHTML=state.customers.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name}</option>`).join('');
  const cells=[categories[0],categories[1],categories[2],categories[3],'CENTER',categories[4],categories[5],categories[6],categories[7]];
  $('grid9').innerHTML=cells.map(cat=>{
    if(cat==='CENTER'){const n=state.people.filter(p=>p.customerId===c.id).length;return `<button class="cell center"><b>${c.name}</b><strong>${n}</strong><small>成交客戶・總人脈</small></button>`}
    const ps=state.people.filter(p=>p.customerId===c.id&&p.category===cat);const f=ps.filter(p=>p.follow&&p.status!=='已成交').length;
    return `<button class="cell" onclick="openCategory('${cat}')"><b>${cat}</b><strong>${ps.length}</strong><small>${f?`待追蹤 ${f} 人`:'點擊查看'}</small></button>`}).join('');
}
function renderTasks(){
  const today=isoToday();const week=new Date();week.setDate(week.getDate()+7);const weekIso=week.toISOString().slice(0,10);
  let arr=state.people.filter(p=>p.follow&&p.status!=='已成交');
  if(taskFilter==='overdue')arr=arr.filter(p=>p.follow<today);
  if(taskFilter==='today')arr=arr.filter(p=>p.follow===today);
  if(taskFilter==='week')arr=arr.filter(p=>p.follow>=today&&p.follow<=weekIso);
  arr.sort((a,b)=>a.follow.localeCompare(b.follow));
  $('taskList').innerHTML=arr.length?arr.map(p=>{const c=state.customers.find(c=>c.id===p.customerId);return `<div class="item" onclick="openPersonDetail('${p.id}')"><div><div class="name">${p.name}</div><div class="meta">${fmt(p.follow)}・${p.status}</div><div class="meta">來源：${c?.name||''}・${p.category}</div></div><span class="badge">${p.event}</span></div>`}).join(''):'<div class="empty">此篩選沒有待辦</div>';
}
function setTaskFilter(f,el){taskFilter=f;document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderTasks()}
function renderStats(){
  $('funnel').innerHTML=statuses.slice(0,9).map(s=>`<div class="item"><span>${s}</span><b>${state.people.filter(p=>p.status===s).length}</b></div>`).join('');
  $('sourceStats').innerHTML=categories.map(s=>`<div class="item"><span>${s}</span><b>${state.people.filter(p=>p.category===s).length} 人</b></div>`).join('');$('referralTree').innerHTML=renderReferralTree();
}
function fillSelects(){
  $('pCategory').innerHTML=categories.map(x=>`<option>${x}</option>`).join('');
  $('pStatus').innerHTML=statuses.map(x=>`<option>${x}</option>`).join('');

function clearCustomerForm(){['cId','cName','cPhone','cLine','cBirthday','cJob','cCompany','cPremium','cSource','cNote'].forEach(id=>$(id).value='');$('cDate').value=isoToday()}
function openCustomer(id=''){clearCustomerForm();$('customerModalTitle').textContent=id?'編輯成交客戶':'新增成交客戶';if(id){const c=state.customers.find(x=>x.id===id);Object.entries({cId:c.id,cName:c.name,cPhone:c.phone,cLine:c.line,cBirthday:c.birthday,cDate:c.date,cJob:c.job,cCompany:c.company,cFamily:c.family,cPremium:c.premium,cType:c.type,cSource:c.source,cNote:c.note}).forEach(([k,v])=>$(k).value=v||'')}openM('customerModal')}
function saveCustomer(){
  if(!$('cName').value.trim()||!$('cDate').value)return toast('請填姓名與成交日期');
  const data={id:$('cId').value||uid('c'),name:$('cName').value.trim(),phone:$('cPhone').value,line:$('cLine').value,birthday:$('cBirthday').value,date:$('cDate').value,job:$('cJob').value,company:$('cCompany').value,family:$('cFamily').value,premium:$('cPremium').value,type:$('cType').value,source:$('cSource').value,note:$('cNote').value};

function openCustomerDetail(id,tab='overview'){
 const c=state.customers.find(x=>x.id===id),ps=state.people.filter(p=>p.customerId===id);if(!c)return;
 const logs=state.logs.filter(l=>l.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));const policies=state.policies.filter(p=>p.customerId===id);const todos=state.todos.filter(t=>t.customerId===id);
 const tabs=[['overview','基本資料'],['grid','九宮格'],['logs','聯絡紀錄'],['todos','待辦'],['policies','保單']];let body='';
 if(tab==='overview')body=`<div class="card" style="box-shadow:none;border:1px solid var(--line)"><div class="item"><span>職業／公司</span><b>${c.job||'未填'}${c.company?'・'+c.company:''}</b></div><div class="item"><span>家庭狀況</span><b>${c.family||'未填'}</b></div><div class="item"><span>成交日期</span><b>${fmt(c.date)}</b></div><div class="item"><span>年繳保費</span><b>NT$${money(c.premium)}</b></div></div>`;
 if(tab==='grid'){const cells=[categories[0],categories[1],categories[2],categories[3],'CENTER',categories[4],categories[5],categories[6],categories[7]];body=`<div class="mini-grid">${cells.map(cat=>cat==='CENTER'?`<button class="cell center"><b>${c.name}</b><strong>${ps.length}</strong><small>總人脈</small></button>`:(()=>{const a=ps.filter(p=>p.category===cat);return `<button class="cell" onclick="closeM('detailModal');state.selectedCustomerId='${c.id}';persist();navTo('grid');setTimeout(()=>openCategory('${cat}'),100)"><b>${cat}</b><strong>${a.length}</strong><small>${a.filter(p=>p.follow&&p.status!=='已成交').length} 待追蹤</small></button>`})()).join('')}</div>`}
 if(tab==='logs')body=`<button class="btn secondary" style="width:100%;margin-bottom:10px" onclick="closeM('detailModal');openContactLogForCustomer('${c.id}')">＋ 新增聯絡紀錄</button>${logs.length?`<div class="timeline">${logs.map(l=>`<div class="timeline-entry"><b>${l.method}・${l.note||'無內容'}</b><span>${fmt(l.date)}</span></div>`).join('')}</div>`:'<div class="empty">尚無聯絡紀錄</div>'}`;
 if(tab==='todos')body=`<button class="btn secondary" style="width:100%;margin-bottom:10px" onclick="openTodo('${c.id}')">＋ 新增待辦</button>${todos.length?todos.map(t=>`<div class="todo-card" onclick="toggleTodo('${t.id}');openCustomerDetail('${c.id}','todos')"><b>${t.done?'✓ ':''}${t.title}</b><div class="meta">${fmt(t.date)}${t.note?'・'+t.note:''}</div></div>`).join(''):'<div class="empty">尚無待辦</div>'}`;
 if(tab==='policies')body=`<button class="btn secondary" style="width:100%;margin-bottom:10px" onclick="openPolicy('${c.id}')">＋ 新增保單</button>${policies.length?policies.map(p=>`<div class="policy-card"><b>${p.company||'未填公司'}・${p.name||p.type}</b><div class="meta">${p.type}｜保額 NT$${money(p.coverage)}｜年繳 NT$${money(p.premium)}</div></div>`).join(''):'<div class="empty">尚無保單資料</div>'}`;
 $('detail').innerHTML=`<h3>${c.name}</h3><div class="tabs">${tabs.map(([k,l])=>`<button class="tab-btn ${tab===k?'active':''}" onclick="openCustomerDetail('${c.id}','${k}')">${l}</button>`).join('')}</div>${body}<button class="btn danger" style="margin-top:12px" onclick="deleteCustomer('${c.id}')">刪除客戶</button>`;openM('detailModal');
}
function deleteCustomer(id){if(!confirm('會一併刪除此客戶底下的人脈，確定嗎？'))return;state.customers=state.customers.filter(x=>x.id!==id);state.people=state.people.filter(x=>x.customerId!==id);state.logs=state.logs.filter(x=>x.customerId!==id);closeM('detailModal');persist()}

function clearPersonForm(){['pId','pName','pRelation','pPhone','pLine','pJob','pCompany','pTags','pLastContact','pFollow','pNote'].forEach(id=>$(id).value='');$('pHeat').value='3'}
function openPerson(cat='',id=''){if(!state.customers.length)return toast('請先新增成交客戶');clearPersonForm();fillSelects();$('personModalTitle').textContent=id?'編輯人脈':'新增人脈';$('pCustomer').value=state.selectedCustomerId||state.customers[0].id;if(cat)$('pCategory').value=cat;
  if(id){const p=state.people.find(x=>x.id===id);Object.entries({pId:p.id,pCustomer:p.customerId,pName:p.name,pCategory:p.category,pRelation:p.relation,pPhone:p.phone,pLine:p.line,pJob:p.job,pCompany:p.company,pEvent:p.event,pHeat:p.heat||3,pTags:p.tags||'',pLastContact:p.lastContact||'',pStatus:p.status,pFollow:p.follow,pNote:p.note}).forEach(([k,v])=>$(k).value=v||'')}
  openM('personModal');
}
function savePerson(){
  if(!$('pName').value.trim())return toast('請填姓名');
  const data={id:$('pId').value||uid('p'),customerId:$('pCustomer').value,name:$('pName').value.trim(),category:$('pCategory').value,relation:$('pRelation').value,phone:$('pPhone').value,line:$('pLine').value,job:$('pJob').value,company:$('pCompany').value,event:$('pEvent').value,heat:Number($('pHeat').value),tags:$('pTags').value,lastContact:$('pLastContact').value,status:$('pStatus').value,follow:$('pFollow').value,note:$('pNote').value};
  const i=state.people.findIndex(x=>x.id===data.id);if(i>=0)state.people[i]=data;else state.people.push(data);
  if(data.status==='已成交'&&!state.customers.some(c=>c.name===data.name)&&confirm('此人脈已成交，是否建立為新的成交客戶與九宮格？')){const c={id:uid('c'),name:data.name,phone:data.phone,line:data.line,birthday:'',date:isoToday(),job:data.job,company:data.company,family:'未填寫',premium:'',type:'其他',source:state.customers.find(x=>x.id===data.customerId)?.name||'',note:'由九宮格人脈轉換'};state.customers.unshift(c);state.selectedCustomerId=c.id}

function openCategory(cat){
  const c=state.customers.find(c=>c.id===state.selectedCustomerId),ps=state.people.filter(p=>p.customerId===c.id&&p.category===cat);
  $('detail').innerHTML=`<h3>${c.name}・${cat}</h3>${ps.length?ps.map(p=>`<div class="item" onclick="openPersonDetail('${p.id}')"><div><div class="name">${p.name}</div><div class="meta">${p.job||'未填職業'}・${p.status}</div></div><span class="badge">${p.event}</span></div>`).join(''):'<div class="empty">尚無人脈</div>'}<button class="btn primary" style="margin-top:12px" onclick="closeM('detailModal');openPerson('${cat}')">＋ 新增${cat}人脈</button>`;
  openM('detailModal');

function openPersonDetail(id){const p=state.people.find(x=>x.id===id),c=state.customers.find(x=>x.id===p.customerId);const tags=(p.tags||'').split(',').map(x=>x.trim()).filter(Boolean);$('detail').innerHTML=`<h3>${p.name}</h3><p class="sub">來源：${c?.name||''}・${p.category}</p><div class="heat">${'★'.repeat(p.heat||3)}${'☆'.repeat(5-(p.heat||3))}</div>${tags.map(t=>`<span class="tag">${t}</span>`).join('')}<div class="card" style="box-shadow:none;border:1px solid var(--line)"><div class="item"><span>目前進度</span><b>${p.status}</b></div><div class="item"><span>最後聯絡</span><b>${fmt(p.lastContact)}</b></div><div class="item"><span>下次追蹤</span><b>${fmt(p.follow)}</b></div></div><button class="btn primary" style="margin-bottom:10px" onclick="convertPerson('${p.id}')">一鍵成交並建立九宮格</button><button class="btn ghost" style="margin-bottom:10px" onclick="closeM('detailModal');openPerson('','${p.id}')">編輯人脈</button><button class="btn danger" onclick="deletePerson('${p.id}')">刪除此人脈</button>`;openM('detailModal');}
function deletePerson(id){if(!confirm('確定刪除此人脈？'))return;state.people=state.people.filter(x=>x.id!==id);state.logs=state.logs.filter(x=>x.personId!==id);closeM('detailModal');persist()}

let pendingCustomerLogId='';
function openContactLog(personId){pendingCustomerLogId='';$('logPersonId').value=personId;$('logDate').value=isoToday();$('logMethod').value='LINE';$('logNote').value='';$('logNext').value='';openM('contactModal')}
function openContactLogForCustomer(customerId){pendingCustomerLogId=customerId;$('logPersonId').value='';$('logDate').value=isoToday();$('logMethod').value='LINE';$('logNote').value='';$('logNext').value='';openM('contactModal')}
function saveContactLog(){const personId=$('logPersonId').value,p=personId?state.people.find(x=>x.id===personId):null;state.logs.push({id:uid('l'),personId:personId||'',customerId:pendingCustomerLogId||(p?.customerId||''),date:$('logDate').value||isoToday(),method:$('logMethod').value,note:$('logNote').value.trim(),next:$('logNext').value.trim()});closeM('contactModal');persist();toast('聯絡紀錄已儲存')}

function openPolicy(id){$('policyCustomerId').value=id;['policyCompany','policyName','policyCoverage','policyPremium','policyStart','policyNote'].forEach(x=>$(x).value='');openM('policyModal')}
function savePolicy(){state.policies.push({id:uid('po'),customerId:$('policyCustomerId').value,company:$('policyCompany').value,name:$('policyName').value,type:$('policyType').value,coverage:$('policyCoverage').value,premium:$('policyPremium').value,start:$('policyStart').value,note:$('policyNote').value});const id=$('policyCustomerId').value;closeM('policyModal');persist();openCustomerDetail(id,'policies')}

function treeNode(c){const ch=state.customers.filter(x=>x.source===c.name);return `<div class="tree-node"><b>${c.name}</b><div class="meta">${ch.length} 位直接成交介紹</div>${ch.map(x=>treeNode(x)).join('')}</div>`}

function exportData(){
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project9grid-backup-'+isoToday()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=x.data||x;if(!state.customers||!state.people)throw 0;if(!state.logs)state.logs=[];if(!state.policies)state.policies=[];if(!state.todos)state.todos=[];persist();toast('備份已匯入')}catch{toast('檔案格式不正確')}};r.readAsText(f);
}
function resetAll(){if(!confirm('確定清除所有客戶與人脈資料？'))return;state={customers:[],people:[],logs:[],policies:[],todos:[],selectedCustomerId:''};persist();toast('資料已清除')}
